# SQLite / Turso (libSQL).
#
# By default every environment uses a local SQLite file in storage/.
# Set TURSO_DATABASE_URL (libsql://<db>-<org>.turso.io) and TURSO_AUTH_TOKEN to
# point development or production at a Turso database instead.
#
# Don't use the adapter's `replica_path` option: in that mode writes only go to
# the local file and never reach Turso.
#
# The test environment always uses a local SQLite file so specs never touch Turso.
#
# Turso databases are created with the Turso CLI/dashboard, not `db:create`.
# Load the schema into a fresh one with `bin/rails db:schema:load`, or import an
# existing SQLite file with `turso db import`.

<% use_turso = ENV["TURSO_DATABASE_URL"].present? %>
<%# Hosts like Render have ephemeral disks, so a local SQLite file in production would lose data on every deploy. %>
<% if Rails.env.production? && !use_turso && ENV["ALLOW_LOCAL_SQLITE_IN_PRODUCTION"].blank? && ENV["SECRET_KEY_BASE_DUMMY"].blank? %>
<% raise "TURSO_DATABASE_URL and TURSO_AUTH_TOKEN must be set in production" %>
<% end %>

local: &local
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

<% if use_turso %>
default: &default
  adapter: turso
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # The turso adapter reads the URL from `database:`; `url:` breaks adapter lookup.
  database: <%= ENV["TURSO_DATABASE_URL"] %>
  token: <%= ENV["TURSO_AUTH_TOKEN"] %>
<% else %>
default: &default
  <<: *local
<% end %>

# Solid Cache, Queue and Cable share the primary database. `database_tasks: false`
# stops Rails from trying to create/load/dump them separately.
development:
  primary: &primary_development
    <<: *default
    <% unless use_turso %>
    database: storage/development.sqlite3
    <% end %>
  cache:
    <<: *primary_development
    database_tasks: false
  queue:
    <<: *primary_development
    database_tasks: false
  cable:
    <<: *primary_development
    database_tasks: false

test:
  <<: *local
  database: storage/test.sqlite3

production:
  primary: &primary_production
    <<: *default
    <% unless use_turso %>
    database: storage/production.sqlite3
    <% end %>
  cache:
    <<: *primary_production
    database_tasks: false
  queue:
    <<: *primary_production
    database_tasks: false
  cable:
    <<: *primary_production
    database_tasks: false
